/* IT ACADEMY — redesigned student workspace */
:root{--bg:#f4f7fb;--panel:#fff;--panel2:#f8fafc;--accent:#2563eb;--accent2:#0f9f8f;--text:#18243a;--t:#14213a;--muted:#718096;--line:#e4eaf2;--danger:#e45c70;--g:linear-gradient(125deg,#2563eb,#4f7df0);--shadow:0 8px 28px rgba(24,42,76,.06);color-scheme:light}

.ach{opacity:.55;filter:grayscale(1)}.ach.ok{opacity:1;filter:none;border-color:#c9d9fb;background:#f6f9ff}canvas{max-height:300px}hr{border:0;border-top:1px solid #e8edf4}

.month-actions{display:flex;gap:9px;flex-wrap:wrap}

/* IT ACADEMY — refined palette + persistent theme */
:root{
 --bg:#f5f6fa;--panel:#ffffff;--panel2:#f0f2f8;--accent:#6558d3;--accent2:#159c91;
 --text:#202238;--t:#202238;--muted:#777b91;--line:#e5e6ef;--danger:#d95d72;
 --g:linear-gradient(125deg,#6558d3,#8175e8);--shadow:0 10px 30px rgba(35,32,75,.055);
 color-scheme:light
}
body{background:var(--bg);color:var(--text)}
.side,.card,.tbl,.auth .card{background:var(--panel);border-color:var(--line)}
.side{border-right-color:var(--line)}
.brand-copy strong,.side-user-copy strong,.top-heading,h1,h2,h3,.st b{color:var(--t)}
.nav{color:var(--muted)}.nav:hover{background:var(--panel2);color:var(--t)}
.nav.on{color:var(--accent);background:#efedff;border-color:#e5e1ff;box-shadow:inset 3px 0 var(--accent)}
.nav-active{color:var(--accent)}
.topbar,.app-footer,.side-bottom{border-color:var(--line)}
input,select,textarea{background:var(--panel);color:var(--text);border-color:var(--line)}
.tbl{background:var(--panel)}td,th{color:var(--muted);border-color:var(--line)}
th{background:var(--panel2)}tr:hover td{background:var(--panel2)}
button.gh,.seg{background:var(--panel2);border-color:var(--line);color:var(--text)}
.seg button{color:var(--muted)}.seg button.on{background:var(--accent)}
.month-teaser{background:linear-gradient(110deg,#f0efff,#eaf8f5);border-color:#e3e0fa}
.month-progress,.forecast-result{background:var(--panel2)}
.theme-toggle{display:inline-flex;align-items:center;gap:7px;padding:8px 11px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);font-size:11px;font-weight:750;cursor:pointer}
.theme-toggle:hover{border-color:var(--accent)}
.theme-toggle svg{width:15px;height:15px}
body[data-theme="dark"]{
 --bg:#11131c;--panel:#1a1d29;--panel2:#222635;--accent:#a69bff;--accent2:#4dc9b7;
 --text:#e8e9f2;--t:#f0efff;--muted:#a1a5ba;--line:#303447;--danger:#ff8295;
 --g:linear-gradient(125deg,#7165df,#8d80ed);--shadow:0 10px 30px rgba(0,0,0,.22);
 color-scheme:dark
}
body[data-theme="dark"] .side,body[data-theme="dark"] .card,body[data-theme="dark"] .tbl,
body[data-theme="dark"] .auth .card{background:var(--panel);border-color:var(--line)}
body[data-theme="dark"] .side{border-right-color:var(--line)}
body[data-theme="dark"] .brand-copy strong,body[data-theme="dark"] .side-user-copy strong,
body[data-theme="dark"] .top-heading,body[data-theme="dark"] h1,body[data-theme="dark"] h2,
body[data-theme="dark"] h3,body[data-theme="dark"] .st b{color:var(--t)}
body[data-theme="dark"] .nav{color:var(--muted)}
body[data-theme="dark"] .nav:hover,body[data-theme="dark"] .nav.on{background:#2a2940;color:#c2baff;border-color:#454064}
body[data-theme="dark"] .nav.on{box-shadow:inset 3px 0 var(--accent)}
body[data-theme="dark"] .topbar,body[data-theme="dark"] .app-footer,body[data-theme="dark"] .side-bottom{border-color:var(--line)}
body[data-theme="dark"] input,body[data-theme="dark"] select,body[data-theme="dark"] textarea{background:#202433;color:var(--text);border-color:var(--line)}
body[data-theme="dark"] .tbl{background:var(--panel)}
body[data-theme="dark"] td,body[data-theme="dark"] th{color:var(--muted);border-color:var(--line)}
body[data-theme="dark"] th,body[data-theme="dark"] tr:hover td{background:var(--panel2)}
body[data-theme="dark"] button.gh,body[data-theme="dark"] .seg{background:var(--panel2);border-color:var(--line);color:var(--text)}
body[data-theme="dark"] .seg button{color:var(--muted)}
body[data-theme="dark"] .seg button.on{background:var(--accent);color:#171528}
body[data-theme="dark"] .month-teaser{background:linear-gradient(110deg,#28263e,#1d3435);border-color:#3b3a56}
body[data-theme="dark"] .month-progress,body[data-theme="dark"] .forecast-result{background:var(--panel2)}
body[data-theme="dark"] .ring span{background:var(--panel);color:var(--t)}
body[data-theme="dark"] .st:after{background:#282d40}
body[data-theme="dark"] .auth{background:radial-gradient(ellipse at 50% 0%,#292746,transparent 48%),var(--bg)}
body[data-theme="dark"] .tt{background:var(--panel);color:var(--text);border-color:var(--line)}
body[data-theme="dark"] .pill{background:#193d38;color:#72ddbd}
body[data-theme="dark"] .pill.r{background:#482832;color:#ff9aaa}
body[data-theme="dark"] .pill.y{background:#443923;color:#f4c878}
body[data-theme="dark"] .bar{background:#34394b}

 <div class="card"><div class="tbl"><table><tr><th>Модератор</th><th>Статус</th><th>Блокувань</th><th>Розблокувань</th><th>Остання дія</th><th></th></tr>${ms.map(p=>{const m=mine(p.id);return`<tr><td><b>${esc(p.name)}</b><div class="mut">${esc(p.email)}</div></td><td>${stCell(p)}</td><td>${m.filter(a=>a.action==='ban').length}</td><td>${m.filter(a=>a.action==='unban').length}</td><td>${m[0]?fdt(m[0].created_at):'—'}</td><td style="white-space:nowrap">${banAct(p)} ${roleBtn(p)}</td></tr>`}).join('')||'<tr><td colspan=6 class="mut">Модераторів немає</td></tr>'}</table></div></div>
 <div class="card"><h2>Дії модераторів</h2><div class="tbl"><table>${A.au.filter(a=>a.actor_role==='moderator').slice(0,60).map(a=>`<tr><td class="mut" style="white-space:nowrap">${fdt(a.created_at)}</td><td><b>${esc(a.actor_name)}</b> ${esc(auText(a))}</td></tr>`).join('')||'<tr><td class="mut">Дій ще не було</td></tr>'}</table></div></div>`]},
bans(){const live=b=>!b.lifted_at&&!(b.until&&new Date(b.until)<=Date.now()),st=b=>b.lifted_at?(b.lift_kind==='expired'?'<span class="pill y">завершено</span>':b.lift_kind==='replaced'?'<span class="pill y">замінено</span>':'<span class="pill">знято</span>'):live(b)?'<span class="pill r">діє</span>':'<span class="pill y">завершено</span>';
 return[`<h1>Історія блокувань</h1><div class="card"><div class="tbl"><table><tr><th>Дата</th><th>Користувач</th><th>Причина</th><th>Виконавець</th><th>Термін</th><th>Статус</th><th></th></tr>${A.bn.map(b=>`<tr><td class="mut">${fdt(b.created_at)}</td><td>${esc(pname(b.user_id))}</td><td>${esc(b.reason)}</td><td>${esc(b.by_name||'—')}</td><td>${b.until?'до '+fdt(b.until):'безстроково'}</td><td>${st(b)}</td><td>${live(b)&&b.user_id!==S.u.id?`<button class="b sm" onclick="unban('${b.user_id}')">Розблокувати</button>`:''}</td></tr>`).join('')||'<tr><td colspan=7 class="mut">Блокувань ще не було</td></tr>'}</table></div></div>`]},
audit(){return[`<h1>Журнал адміністративних дій</h1><p class="mut">Журнал веде сервер; змінити чи видалити записи неможливо.</p><div class="card"><div class="tbl"><table><tr><th>Час</th><th>Роль</th><th>Дія</th></tr>${A.au.map(a=>`<tr><td class="mut" style="white-space:nowrap">${fdt(a.created_at)}</td><td><span class="pill y">${ROLE[a.actor_role]||'система'}</span></td><td><b>${esc(a.actor_name||'—')}</b> ${esc(auText(a))}</td></tr>`).join('')||'<tr><td colspan=3 class="mut">Порожньо</td></tr>'}</table></div></div>`]},
msgs(){return[`<h1>Повідомлення</h1><div class="card" style="max-width:560px"><label>Отримувач</label><select id="mt">${A.pr.filter(p=>p.id!==S.u.id).map(p=>`<option value="${p.id}">${esc(p.name||p.email)} · ${ROLE[p.role]}</option>`).join('')}</select><label>Заголовок</label><input id="mti" maxlength="120"><label>Текст</label><textarea id="mb" rows="3" maxlength="1000"></textarea><br><br><button class="b" onclick="sendMsg()"><i data-lucide="send"></i>Надіслати</button></div><div class="card"><h2>Надіслані</h2><div class="tbl"><table>${A.ms.map(m=>`<tr><td class="mut">${fdt(m.created_at)}</td><td>${esc(pname(m.to_id))}</td><td><b>${esc(m.title)}</b></td><td>${m.read_at?'<span class="pill">прочитано</span>':'<span class="pill y">нове</span>'}</td></tr>`).join('')||'<tr><td class="mut">Немає</td></tr>'}</table></div></div>`]},
live(){return[`<h1>Live Activity <span class="pill">● realtime</span></h1><div class="card"><div class="tbl"><table>${feed().slice(0,60).map(feedRow).join('')||'<tr><td class="mut">Очікуємо події…</td></tr>'}</table></div></div>`]}
});

/* ---------- панель модератора (обмежені права; решту перевіряє сервер) ---------- */
const MV={
overview(){const me=S.u.id,mine=A.au.filter(a=>a.actor_id===me),us=A.pr.filter(p=>p.role==='user'),on=us.filter(online).length,
 act=A.bn.filter(b=>b.by_id===me&&!b.lifted_at&&(!b.until||new Date(b.until)>Date.now())).length;
 return[`<h1>Панель модератора</h1><div class="grid g4">${stat('users',us.length,'Користувачів')}${stat('wifi',on,'Онлайн','sOn')}${stat('ban',us.filter(isBl).length,'Заблоковано зараз')}${stat('gavel',mine.filter(a=>a.action==='ban').length,'Моїх блокувань')}${stat('unlock',mine.filter(a=>a.action==='unban').length,'Моїх розблокувань')}${stat('shield-alert',act,'Мої діючі блокування')}</div>${inboxHtml()}<div class="card"><h2>Мої дії (14 днів)</h2>${cv('c1')}</div>`,
 ()=>{const days=[...Array(14)].map((_,i)=>dstr(13-i)),n=(k,d)=>mine.filter(a=>a.action===k&&ld(a.created_at)===d).length;mkChart('c1',{type:'bar',data:{labels:days.map(d=>d.slice(5)),datasets:[{label:'Блокування',data:days.map(d=>n('ban',d)),backgroundColor:C.r,borderRadius:6},{label:'Розблокування',data:days.map(d=>n('unban',d)),backgroundColor:C.a,borderRadius:6}]}})}]},
users(){const q=(S.uq||'').toLowerCase(),f=S.uf||'',rows=A.pr.filter(p=>p.role==='user'&&(!q||(p.email+p.name).toLowerCase().includes(q))&&(!f||(f==='on'?online(p):isBl(p))));
 return[`<h1>Користувачі</h1><div class="card"><div class="row"><input id="uq" placeholder="Пошук за ім’ям або email" value="${esc(S.uq||'')}" oninput="S.uq=this.value;clearTimeout(S.ut);S.ut=setTimeout(go,300)"><select onchange="S.uf=this.value;go()">${[['','Усі'],['on','Онлайн'],['bl','Заблоковані']].map(o=>`<option value="${o[0]}" ${f===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div><br>
 <div class="tbl"><table><tr><th>Користувач</th><th>Реєстрація</th><th>Статус</th><th></th></tr>${rows.map(p=>`<tr><td><b>${esc(p.name)}</b><div class="mut">${esc(p.email)}</div></td><td class="mut">${fdt(p.created_at)}</td><td>${stCell(p)}</td><td style="white-space:nowrap"><button class="b gh sm" onclick="basicModal('${p.id}')"><i data-lucide="eye"></i></button> ${banAct(p)}</td></tr>`).join('')||'<tr><td colspan=4 class="mut">Нікого не знайдено</td></tr>'}</table></div></div>`,refocus]},
history(){const mine=A.au.filter(a=>a.actor_id===S.u.id);return[`<h1>Історія моїх дій</h1><div class="card"><div class="tbl"><table>${mine.map(a=>`<tr><td class="mut" style="white-space:nowrap">${fdt(a.created_at)}</td><td>${esc(auText(a))}</td></tr>`).join('')||'<tr><td class="mut">Дій ще не було</td></tr>'}</table></div></div>`]}};
MV.settings=SV.settings;

/* ---------- дії персоналу (кожна — через RPC з перевіркою на сервері) ---------- */
function banModal(id){const p=A.pr.find(x=>x.id===id)||{};modal(`<h2>Блокування: ${esc(p.name||p.email)}</h2><label>Причина (обов’язково)</label><textarea id="bR" rows="3" maxlength="300"></textarea><label>Термін</label><select id="bT"><option value="1h">1 година</option><option value="1d">1 день</option><option value="7d">7 днів</option><option value="30d">30 днів</option><option value="perm">Безстроково</option></select><div class="err" id="mE"></div><div class="row"><button class="b gh" onclick="closeM()">Скасувати</button><button class="b rd" onclick="doBan('${id}')">Заблокувати</button></div>`)}
async function doBan(id){const r=$('#bR').value.trim();if(r.length<3)return $('#mE').textContent='Вкажіть причину (мінімум 3 символи)';
 const ms={'1h':36e5,'1d':864e5,'7d':6048e5,'30d':2592e6}[$('#bT').value],until=ms?new Date(Date.now()+ms).toISOString():null;
 const{error}=await sb.rpc('ban_user',{target:id,why:r,until_ts:until});if(error)return $('#mE').textContent=error.message;closeM();await staffReload();toast('Користувача заблоковано');go()}
async function unban(id){if(!confirm('Розблокувати користувача?'))return;const{error}=await sb.rpc('unban_user',{target:id});if(error)return toast(error.message,1);await staffReload();toast('Розблоковано');go()}
async function setRole(id,role){if(!id)return;if(!confirm(role==='moderator'?'Призначити модератором?':'Зняти роль модератора?'))return;const{error}=await sb.rpc('set_role',{target:id,new_role:role});if(error)return toast(error.message,1);await staffReload();toast('Роль змінено');go()}
function basicModal(id){const p=A.pr.find(x=>x.id===id);if(!p)return;const b=isBl(p)?activeBan(id):null;
 modal(`<div class="row" style="flex-wrap:nowrap">${avatar(p,52)}<div><b>${esc(p.name)}</b><div class="mut">${esc(p.email)}</div></div></div><p>Реєстрація: <b>${fdt(p.created_at)}</b><br>Остання активність: <b>${fdt(p.last_seen)}</b><br>Статус: ${stCell(p)}</p>${b?`<p>Причина: <b>${esc(b.reason)}</b><br>Виконавець: ${esc(b.by_name||'—')}<br>Діє до: ${b.until?fdt(b.until):'безстроково'}</p>`:''}<button class="b gh" onclick="closeM()">Закрити</button>`)}
const activeBan=id=>A.bn.find(b=>b.user_id===id&&!b.lifted_at);
async function sendMsg(){const to=$('#mt').value,t=$('#mti').value.trim(),b=$('#mb').value.trim();if(!to||!t)return toast('Оберіть отримувача й вкажіть заголовок',1);
 const{error}=await sb.from('messages').insert({to_id:to,from_id:S.u.id,title:t,body:b});if(error)return toast(error.message,1);toast('Надіслано ✔');await loadAdmin();go()}
const expAudit=()=>csv([['time','actor','role','action','target','details']].concat(A.au.map(a=>[a.created_at,a.actor_name,a.actor_role,a.action,a.target_name,JSON.stringify(a.details)])),'audit.csv');
const expBans=()=>csv([['created','user','reason','by','until','lifted_at','kind']].concat(A.bn.map(b=>[b.created_at,pname(b.user_id),b.reason,b.by_name,b.until,b.lifted_at,b.lift_kind])),'bans.csv');
</script>
<script>try{document.body.dataset.theme=localStorage.getItem("it_academy_theme")||"light"}catch(e){}</script>
</body>
