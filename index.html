<html lang="uk">
<head>

<title>IT ACADEMY</title>

<style>

/* ==========================================================
   IT ACADEMY — CLEAN ACADEMIC PRODUCT UI

   ========================================================== */
:root{
  color-scheme:light;
  --bg:#f3f6fb;
  --card:#ffffff;
  --navy:#111b31;
  --navy2:#192743;
  --a:#4263eb;
  --v:#7657e8;
  --t:#0e9f91;
  --tx:#17233b;
  --mut:#71809b;
  --line:#e4eaf3;
  --red:#d94b68;
  --g:linear-gradient(120deg,#4263eb 0%,#7657e8 100%);
  --shadow:0 8px 24px rgba(27,48,84,.055);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;overflow-x:hidden;
  background:var(--bg);color:var(--tx);
  font:14px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  -webkit-font-smoothing:antialiased;
}
body::before,body::after{content:none}
@keyframes pop{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.load{display:grid;place-items:center;min-height:100vh;background:var(--bg)}
.spin{width:38px;height:38px;border-radius:50%;border:3px solid #dce4f2;border-top-color:var(--a);animation:spin .8s linear infinite}
.shell{position:relative;z-index:1;display:flex;min-height:100vh}
.side{
  width:254px;flex:none;position:sticky;top:0;height:100vh;overflow-y:auto;
  display:flex;flex-direction:column;gap:5px;padding:25px 16px 18px;
  background:var(--navy);border-right:1px solid #263653;
  box-shadow:5px 0 24px rgba(17,27,49,.08);
}
.logo{
  display:block;padding:3px 12px 24px;color:#fff;
  font-size:21px;font-weight:850;letter-spacing:-.5px;
  background:none;-webkit-text-fill-color:#fff;
}
.tag{
  margin:0 7px 14px;padding:8px 11px;border-radius:8px;
  color:#aebde0;background:#ffffff0b;border:1px solid #ffffff12;
  font-size:10px;font-weight:750;letter-spacing:1.35px;text-transform:uppercase;
}
.nav{
  width:100%;display:flex;align-items:center;gap:12px;
  min-height:43px;padding:10px 12px;border:1px solid transparent;border-radius:9px;
  color:#aebbd2;background:transparent;text-align:left;cursor:pointer;
  font:500 13px/1.35 inherit;transition:background .18s,color .18s,border-color .18s;
}
.nav svg{width:17px;height:17px;flex:none;stroke-width:1.8}
.nav:hover{color:#fff;background:#ffffff0c}
.nav.on{
  color:#fff;background:#4263eb2b;border-color:#7891f04d;
  box-shadow:inset 3px 0 0 #8298ff;
}
.main{flex:1;min-width:0;max-width:none;padding:34px clamp(20px,3.3vw,52px) 48px;animation:pop .28s ease-out both}
.main>*{max-width:1400px}
.card{
  padding:21px;margin:0 0 17px;border:1px solid var(--line);border-radius:14px;

.card:hover{border-color:#d5def0;box-shadow:0 12px 30px rgba(27,48,84,.075)}

h2{margin:0 0 14px;color:#1c2a45;font-size:16px;line-height:1.35;font-weight:730;letter-spacing:-.2px}
h3{color:#24334f}
.mut{color:var(--mut);font-size:12px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.st{position:relative;overflow:hidden;min-height:126px}
.st:after{content:"";position:absolute;right:-28px;top:-38px;width:105px;height:105px;border-radius:50%;background:#4263eb09;pointer-events:none}
.st b{display:block;margin-top:8px;color:#263b69;font-size:29px;font-weight:800;letter-spacing:-1px;background:none;-webkit-text-fill-color:currentColor}
.st svg{color:var(--a);width:19px;height:19px}
input,select,textarea,button{font:inherit}
input,select,textarea{
  width:100%;padding:11px 13px;border:1px solid #d9e1ee;border-radius:9px;
  background:#fff;color:#1c2a45;outline:none;transition:border-color .16s,box-shadow .16s;
}
input::placeholder,textarea::placeholder{color:#a3aec1}
input:focus,select:focus,textarea:focus{border-color:#7189ee;box-shadow:0 0 0 3px #4263eb17}
input:disabled,select:disabled,textarea:disabled{background:#f1f4f9;color:#8995a9}
label{display:block;margin:11px 0 5px;color:#586985;font-size:12px;font-weight:650}
button.b{

  padding:10px 16px;border:1px solid transparent;border-radius:9px;
  color:#fff;background:var(--g);font-size:12px;font-weight:720;

button.b:hover{transform:translateY(-1px);filter:brightness(1.04);box-shadow:0 6px 16px #4263eb2c}
button.b:active{transform:translateY(0)}
button.gh{color:#42516c;background:#f1f4fa;border-color:#e4eaf3;box-shadow:none}
button.gh:hover{background:#e9eef8;box-shadow:none}
button.rd{background:linear-gradient(120deg,#d94b68,#e46a65)}
button.sm{padding:6px 10px;font-size:11px;border-radius:7px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{flex:1;min-width:130px}
.row>.n{flex:none;min-width:0}
table{width:100%;border-collapse:separate;border-spacing:0}
td,th{padding:12px 11px;border-bottom:1px solid #edf0f5;text-align:left;font-size:13px;color:#34435e}
th{color:#77849b;background:#f7f9fc;font-size:10px;font-weight:750;letter-spacing:.65px;text-transform:uppercase}
tr:last-child td{border-bottom:0}
.tbl{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
.tbl table{min-width:580px}
.tbl th:first-child{border-radius:9px 0 0 0}
.tbl th:last-child{border-radius:0 9px 0 0}
.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:6px;background:#e4f5f2;color:#087f74;font-size:11px;font-weight:700}
.pill.r{background:#fff0f2;color:#c23e5b}
.pill.y{background:#f0edff;color:#684dc9}
.bar{height:8px;border-radius:99px;background:#edf1f7;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#4263eb,#13a99a);transition:width .7s}
.av{width:42px;height:42px;display:grid;place-items:center;flex:none;border-radius:11px;color:#fff;background:var(--g);font-size:16px;font-weight:800;box-shadow:none}
.seg{display:inline-flex;flex-wrap:wrap;gap:3px;padding:3px;border:1px solid #e5eaf3;border-radius:9px;background:#f4f6fa}
.seg button{padding:7px 12px;border:0;border-radius:7px;color:#73819a;background:transparent;font-size:12px;cursor:pointer}
.seg button.on{color:#fff;background:var(--a);box-shadow:0 2px 5px #4263eb25}
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;overflow:auto;padding:16px;background:#17233b80;backdrop-filter:blur(3px)}
.modal .card{width:100%;max-width:540px;margin:0;border-color:#e0e6f0;box-shadow:0 24px 70px #15234230}
#toast{position:fixed;right:18px;bottom:18px;z-index:99;display:flex;flex-direction:column;gap:8px}
.tt{max-width:340px;padding:12px 15px;border:1px solid #dce5f4;border-left:4px solid var(--a);border-radius:9px;background:#fff;color:#24334f;box-shadow:0 8px 26px #17233b20;animation:pop .2s}
.tt.e{border-left-color:var(--red)}
.auth{
  position:relative;z-index:1;min-height:100vh;display:grid;place-items:center;padding:22px;
  background:radial-gradient(ellipse at 50% 0%,#dce6ff 0,transparent 42%),#f3f6fb;
}
.auth .card{
  width:100%;max-width:430px;padding:34px;border:1px solid #e2e8f2;
  border-radius:16px;background:#fff;box-shadow:0 22px 65px rgba(31,54,94,.12);
}
.auth .logo{
  padding:0 0 7px;text-align:center;color:#2947a5;
  background:none;-webkit-text-fill-color:#2947a5;font-size:29px;letter-spacing:-.8px;
}
.auth input{min-height:45px}
.err{min-height:20px;margin-top:8px;color:var(--red);font-size:12px}
.link{color:var(--a);font-size:12px;font-weight:650;cursor:pointer}
.ring{width:110px;height:110px;display:grid;place-items:center;border-radius:50%;background:conic-gradient(var(--a) calc(var(--p)*1%),#e9eef6 0)}
.ring span{width:84px;height:84px;display:grid;place-items:center;border-radius:50%;background:#fff;color:#253858;font-size:26px;font-weight:800}
.ach{opacity:.48;filter:grayscale(1)}
.ach.ok{opacity:1;filter:none;border-color:#d8d1ff;background:#fbfaff}
canvas{max-height:300px}
hr{border:0;border-top:1px solid var(--line)}
a{color:var(--a)}
:focus-visible{outline:3px solid #4263eb44;outline-offset:2px}
@media(max-width:1000px){
  .side{width:224px}
  .main{padding:26px 22px 40px}
}
@media(max-width:860px){
  .shell{flex-direction:column}
  .side{
    width:100%;height:auto;min-height:0;position:sticky;top:0;z-index:10;
    flex-direction:row;align-items:center;overflow-x:auto;overflow-y:hidden;
    padding:8px 10px;background:var(--navy);border-right:0;border-bottom:1px solid #263653;
    box-shadow:0 5px 16px #17233b12;
  }
  .logo,.tag{display:none}
  .nav{width:auto;min-height:39px;flex:none;white-space:nowrap;padding:9px 12px}
  .nav.on{box-shadow:inset 0 -2px 0 #8298ff}
  .main{padding:22px 18px 36px}
}
@media(max-width:560px){
  body{font-size:13px}
  .main{padding:17px 12px 30px}
  h1{font-size:22px}
  .card{padding:15px;margin-bottom:12px;border-radius:12px}
  .grid{gap:10px}
  .grid.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid.g2{grid-template-columns:minmax(0,1fr)}
  .st{min-height:108px}
  .st b{font-size:24px}
  .auth{padding:14px}
  .auth .card{padding:25px 20px}
  .modal{align-items:start;padding:10px}
  td,th{padding:9px 8px;font-size:12px}
  .row{gap:8px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

</style>

overview(){const me=S.u.id,mine=A.au.filter(a=>a.actor_id===me),us=A.pr.filter(p=>p.role==='user'),on=us.filter(online).length,
 act=A.bn.filter(b=>b.by_id===me&&!b.lifted_at&&(!b.until||new Date(b.until)>Date.now())).length;
 return[`<h1>Панель модератора</h1><div class="grid g4">${stat('users',us.length,'Користувачів')}${stat('wifi',on,'Онлайн','sOn')}${stat('ban',us.filter(isBl).length,'Заблоковано зараз')}${stat('gavel',mine.filter(a=>a.action==='ban').length,'Моїх блокувань')}${stat('unlock',mine.filter(a=>a.action==='unban').length,'Моїх розблокувань')}${stat('shield-alert',act,'Мої діючі блокування')}</div>${inboxHtml()}<div class="card"><h2>Мої дії (14 днів)</h2>${cv('c1')}</div>`,
 ()=>{const days=[...Array(14)].map((_,i)=>dstr(13-i)),n=(k,d)=>mine.filter(a=>a.action===k&&ld(a.created_at)===d).length;mkChart('c1',{type:'bar',data:{labels:days.map(d=>d.slice(5)),datasets:[{label:'Блокування',data:days.map(d=>n('ban',d)),backgroundColor:'#ff5c7c',borderRadius:6},{label:'Розблокування',data:days.map(d=>n('unban',d)),backgroundColor:'#35D6C5',borderRadius:6}]}})}]},
users(){const q=(S.uq||'').toLowerCase(),f=S.uf||'',rows=A.pr.filter(p=>p.role==='user'&&(!q||(p.email+p.name).toLowerCase().includes(q))&&(!f||(f==='on'?online(p):isBl(p))));
 return[`<h1>Користувачі</h1><div class="card"><div class="row"><input id="uq" placeholder="Пошук за ім’ям або email" value="${esc(S.uq||'')}" oninput="S.uq=this.value;clearTimeout(S.ut);S.ut=setTimeout(go,300)"><select onchange="S.uf=this.value;go()">${[['','Усі'],['on','Онлайн'],['bl','Заблоковані']].map(o=>`<option value="${o[0]}" ${f===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div>
 <div class="tbl"><table><tr><th>Користувач</th><th>Реєстрація</th><th>Статус</th><th></th></tr>${rows.map(p=>`<tr><td><b>${esc(p.name)}</b><div class="mut">${esc(p.email)}</div></td><td class="mut">${fdt(p.created_at)}</td><td>${stCell(p)}</td><td style="white-space:nowrap"><button class="b gh sm" onclick="basicModal('${p.id}')"><i data-lucide="eye"></i></button> ${banAct(p)}</td></tr>`).join('')||'<tr><td colspan=4 class="mut">Нікого не знайдено</td></tr>'}</table></div></div>`,refocus]},
history(){const mine=A.au.filter(a=>a.actor_id===S.u.id);return[`<h1>Історія моїх дій</h1><div class="card"><div class="tbl"><table>${mine.map(a=>`<tr><td class="mut" style="white-space:nowrap">${fdt(a.created_at)}</td><td>${esc(auText(a))}</td></tr>`).join('')||'<tr><td class="mut">Дій ще не було</td></tr>'}</table></div></div>`]}};
MV.settings=SV.settings;

/* ---------- дії персоналу (кожна — через RPC з перевіркою на сервері) ---------- */
function banModal(id){const p=A.pr.find(x=>x.id===id)||{};modal(`<h2>Блокування: ${esc(p.name||p.email)}</h2><label>Причина (обов’язково)</label><textarea id="bR" rows="3" maxlength="300"></textarea><label>Термін</label><select id="bT"><option value="1h">1 година</option><option value="1d">1 день</option><option value="7d">7 днів</option><option value="30d">30 днів</option><option value="perm">Безстроково</option></select><div class="err" id="mE"></div><div class="row"><button class="b gh" onclick="closeM()">Скасувати</button><button class="b rd" onclick="doBan('${id}')">Заблокувати</button></div>`)}
async function doBan(id){const r=$('#bR').value.trim();if(r.length<3)return $('#mE').textContent='Вкажіть причину (мінімум 3 символи)';
 const ms={'1h':36e5,'1d':864e5,'7d':6048e5,'30d':2592e6}[$('#bT').value],until=ms?new Date(Date.now()+ms).toISOString():null;
 const{error}=await sb.rpc('ban_user',{target:id,why:r,until_ts:until});if(error)return $('#mE').textContent=error.message;closeM();await staffReload();toast('Користувача заблоковано');go()}
async function unban(id){if(!confirm('Розблокувати користувача?'))return;const{error}=await sb.rpc('unban_user',{target:id});if(error)return toast(error.message,1);await staffReload();toast('Розблоковано');go()}
async function setRole(id,role){if(!id)return;if(!confirm(role==='moderator'?'Призначити модератором?':'Зняти роль модератора?'))return;const{error}=await sb.rpc('set_role',{target:id,new_role:role});if(error)return toast(error.message,1);await staffReload();toast('Роль змінено');go()}
function basicModal(id){const p=A.pr.find(x=>x.id===id);if(!p)return;const b=isBl(p)?activeBan(id):null;
 modal(`<div class="row" style="flex-wrap:nowrap">${avatar(p,52)}<div><b>${esc(p.name)}</b><div class="mut">${esc(p.email)}</div></div></div><p>Реєстрація: <b>${fdt(p.created_at)}</b><br>Остання активність: <b>${fdt(p.last_seen)}</b><br>Статус: ${stCell(p)}</p>${b?`<p>Причина: <b>${esc(b.reason)}</b><br>Виконавець: ${esc(b.by_name||'—')}<br>Діє до: ${b.until?fdt(b.until):'безстроково'}</p>`:''}<button class="b gh" onclick="closeM()">Закрити</button>`)}
const activeBan=id=>A.bn.find(b=>b.user_id===id&&!b.lifted_at);
async function sendMsg(){const to=$('#mt').value,t=$('#mti').value.trim(),b=$('#mb').value.trim();if(!to||!t)return toast('Оберіть отримувача й вкажіть заголовок',1);
 const{error}=await sb.from('messages').insert({to_id:to,from_id:S.u.id,title:t,body:b});if(error)return toast(error.message,1);toast('Надіслано ✔');await loadAdmin();go()}
const expAudit=()=>csv([['time','actor','role','action','target','details']].concat(A.au.map(a=>[a.created_at,a.actor_name,a.actor_role,a.action,a.target_name,JSON.stringify(a.details)])),'audit.csv');
const expBans=()=>csv([['created','user','reason','by','until','lifted_at','kind']].concat(A.bn.map(b=>[b.created_at,pname(b.user_id),b.reason,b.by_name,b.until,b.lifted_at,b.lift_kind])),'bans.csv');
</script>
